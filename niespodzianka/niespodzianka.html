<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Niespodzianka ❤️</title>

    <link rel="stylesheet" href="niespodzianka.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>

<header>
    <a href="../index.html">← WRÓĆ DO NAS</a>
    <span>WIKTOR & ZUZIA</span>
    <b>🦇</b>
</header>

<main>

    <div class="eyebrow">SURPRISE FOR YOU</div>

    <h1>
        Niespodzianka
        <span>dla Ciebie</span>
    </h1>

    <p class="intro">
        Tutaj mam dla Ciebie coś specjalnego.
        Wpisz kod, aby go zobaczyć. ❤️
    </p>

    <div id="codeForm" class="code-box">
        <input 
            type="text" 
            id="codeInput" 
            placeholder="Wpisz kod..."
            maxlength="8"
        >
        <button id="submitBtn">ODBLOKUJ</button>
        <div id="errorMsg" class="error-message"></div>
    </div>

    <div id="videoContainer" class="video-container" style="display: none;">
        <video id="video" width="100%" controls>
            <source id="videoSource" src="" type="video/mp4">
            Twoja przeglądarka nie obsługuje odtwarzania wideo.
        </video>
    </div>

</main>

<script src="niespodzianka.js"></script>

</body>
</html>
