<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nasza muzyka ❤️</title>


    <link
        rel="stylesheet"
        href="piosenki.css"
    >


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <div class="music-background"></div>


    <main class="music-page">


        <a
            href="index.html"
            class="back-button"
        >
            ← WRÓĆ DO NAS
        </a>


        <div class="music-header">


            <div class="music-bat">
                🦇
            </div>


            <span class="eyebrow">
                WIKTOR & ZUZIA
            </span>


            <h1>
                Nasza muzyka
            </h1>


            <p>
                Piosenki, które brzmią jak my. ❤️
            </p>

        </div>


        <section class="playlist-card">


            <div class="playlist-top">


                <div
                    class="vinyl"
                    id="vinyl"
                >

                    <div class="vinyl-center">
                        ♡
                    </div>

                </div>


                <div class="playlist-info">

                    <span>
                        PRIVATE PLAYLIST
                    </span>


                    <h2>
                        nasza playlista&lt;3
                    </h2>


                    <p>
                        Wiktor & Zuzia
                    </p>

                </div>

            </div>


            <!-- SPOTIFY -->

            <div class="spotify">

                <iframe
                    src="https://open.spotify.com/embed/playlist/1m8Zzrky3uGBdrS5tEWrri?utm_source=generator"
                    width="100%"
                    height="500"
                    frameborder="0"
                    allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"
                >
                </iframe>

            </div>


        </section>


        <div
            id="playing"
            class="playing"
        >
            🎵 NASZA PLAYLISTA
        </div>


        <div class="music-footer">

            ♡ nasze piosenki,
            nasze wspomnienia ♡

        </div>


    </main>


    <script src="piosenki.js"></script>


</body>

</html>
